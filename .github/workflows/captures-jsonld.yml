name: Captures window — machine-readable index
on:
  schedule:
    - cron: '20 7 * * *'   # daily 07:20 UTC — the canonical registry changes on seating; the static index follows within a day
  workflow_dispatch: {}
jobs:
  project:
    runs-on: ubuntu-latest
    permissions: { contents: write }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: python3 scripts/project_captures_jsonld.py captures/index.html --filter "lee sharks|leesharks|sharks"
      - run: |
          git config user.name "captures-jsonld" && git config user.email "captures@alexanarch.org"
          git add captures/index.html
          git diff --cached --quiet || git commit -m "captures: machine-readable index regenerated from the canonical registry"
          git push
